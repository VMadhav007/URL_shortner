services:

  api:
    build: .
    container_name: url_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - mongodb
      - redis

  mongodb:
    image: mongo:8
    container_name: url_mongodb
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: url_redis
    volumes:
      - redis_data:/data

volumes:
  mongodb_data:
  redis_data: